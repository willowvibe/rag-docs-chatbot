<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rag-docs-chatbot</title>
<style>
  :root {
    --bg: #0a0f1c;
    --surface: #111a2c;
    --surface-raised: #162239;
    --border: #23324d;
    --border-strong: #31456a;
    --text: #e6edf7;
    --muted: #93a4bf;
    --primary: #0ea5e9;
    --primary-strong: #38bdf8;
    --primary-soft: rgba(14, 165, 233, 0.14);
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body {
    background:
      radial-gradient(900px 500px at 12% -10%, rgba(14, 165, 233, 0.16), transparent 60%),
      radial-gradient(700px 420px at 100% 0%, rgba(56, 189, 248, 0.08), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    width: 1920px;
    height: 1080px;
    padding: 120px 140px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .eyebrow {
    margin: 0 0 26px;
    color: var(--primary-strong);
    font-family: var(--mono);
    font-size: 24px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0;
    font-size: 140px;
    line-height: 1;
    letter-spacing: -0.045em;
    font-weight: 720;
  }
  h1 .accent { color: var(--primary-strong); }
  .lede {
    max-width: 1180px;
    margin: 42px 0 0;
    color: var(--muted);
    font-size: 46px;
    line-height: 1.35;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .meta {
    margin-top: 72px;
    display: flex;
    gap: 18px;
    align-items: center;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 24px;
  }
  .chip {
    padding: 10px 18px;
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    background: var(--surface);
    color: var(--text);
  }
  .chip.accent {
    border-color: rgba(14, 165, 233, 0.45);
    background: var(--primary-soft);
    color: var(--primary-strong);
  }
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">Document Q&amp;A</p>
    <h1>rag-docs-chatbot</h1>
    <p class="lede">Cited answers over your documents, with an eval you can reproduce</p>
    <div class="meta">
      <span class="chip accent">PDF · Markdown · HTML</span>
      <span>[n] citations</span>
      <span>·</span>
      <span>40-question eval</span>
    </div>
  </div>
</body>
</html>
