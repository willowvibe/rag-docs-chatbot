<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rag-docs-chatbot eval</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
  :root {
    --paper: #EEF1F4;
    --surface: #FFFFFF;
    --ink: #1B2333;
    --muted: #5B6676;
    --rule: #D5DBE3;
    --blue: #1F4E8C;
    --blue-soft: #E3EBF6;
    --highlight: #FFE36E;
    --shadow: 0 1px 2px rgba(27, 35, 51, 0.04), 0 10px 30px rgba(27, 35, 51, 0.05);
    --font-ui: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-serif: "Source Serif 4", ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .wrap {
    width: 1920px;
    height: 1080px;
    padding: 100px 150px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .eyebrow {
    margin: 0 0 22px;
    color: var(--blue);
    font-family: var(--font-mono);
    font-size: 24px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0 0 44px;
    color: var(--ink);
    font-family: var(--font-serif);
    font-size: 88px;
    font-weight: 600;
    line-height: 1.06;
    letter-spacing: -0.025em;
  }
  .ledger {
    overflow: hidden;
    border: 1px solid var(--rule);
    border-radius: 12px;
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 48px;
    align-items: baseline;
    padding: 24px 44px;
    border-bottom: 1px solid var(--rule);
  }
  .row:last-child { border-bottom: 0; }
  .row.hybrid { background: var(--blue-soft); }
  .label {
    margin: 0;
    color: var(--ink);
    font-size: 34px;
    font-weight: 500;
    line-height: 1.25;
    letter-spacing: -0.01em;
  }
  .row.hybrid .label { color: var(--blue); font-weight: 600; }
  .value {
    display: flex;
    gap: 12px;
    align-items: baseline;
    margin: 0;
    color: var(--blue);
    font-family: var(--font-mono);
    font-size: 76px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .value .unit {
    color: var(--blue);
    font-size: 26px;
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .footnote {
    margin: 30px 0 0;
    color: var(--muted);
    font-size: 24px;
    line-height: 1.45;
  }
  .footnote .mono {
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 22px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">Evaluation</p>
    <h1>Measured, not claimed</h1>
    <div class="ledger">
      <div class="row">
        <p class="label">Evidence hit@5</p>
        <p class="value">87.5%</p>
      </div>
      <div class="row">
        <p class="label">Citation contains the evidence</p>
        <p class="value">87.5%</p>
      </div>
      <div class="row">
        <p class="label">Faithfulness <span style="color: var(--muted); font-weight: 400;">(LLM-judged, self-assessed)</span></p>
        <p class="value">0.97</p>
      </div>
      <div class="row hybrid">
        <p class="label">With hybrid search + reranker</p>
        <p class="value">92.5% <span class="unit">hit@5</span></p>
      </div>
    </div>
    <p class="footnote">40 golden questions &middot; one recorded run &middot; answers by the free <span class="mono">ling-3.2-flash</span> model</p>
  </div>
</body>
</html>
