services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      # Override with RAG_DB_PORT if 5433 is already taken by another Postgres:
      #   RAG_DB_PORT=5435 make up
      - "${RAG_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-https://ollama.com}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-0}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      RAG_MODEL: ${RAG_MODEL:-}
      RAG_CHEAP_MODEL: ${RAG_CHEAP_MODEL:-}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      MAX_QUESTION_CHARS: ${MAX_QUESTION_CHARS:-500}
      PER_IP_PER_HOUR: ${PER_IP_PER_HOUR:-20}
      DAILY_CAP: ${DAILY_CAP:-500}
    ports:
      # Host port 8000 is used by another project on some machines; override with APP_PORT.
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
