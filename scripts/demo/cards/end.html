<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rag-docs-chatbot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
  :root {
    --paper: #EEF1F4;
    --surface: #FFFFFF;
    --ink: #1B2333;
    --muted: #5B6676;
    --rule: #D5DBE3;
    --blue: #1F4E8C;
    --blue-soft: #E3EBF6;
    --highlight: #FFE36E;
    --font-ui: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-serif: "Source Serif 4", ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .wrap {
    width: 1920px;
    height: 1080px;
    padding: 120px 150px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .eyebrow {
    margin: 0 0 28px;
    color: var(--blue);
    font-family: var(--font-mono);
    font-size: 26px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0;
    color: var(--ink);
    font-family: var(--font-serif);
    font-size: 138px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: -0.03em;
  }
  .live {
    margin: 54px 0 0;
    color: var(--blue);
    font-family: var(--font-mono);
    font-size: 52px;
    font-weight: 500;
    line-height: 1.2;
    letter-spacing: -0.02em;
  }
  .source {
    display: flex;
    gap: 20px;
    align-items: baseline;
    margin: 22px 0 0;
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 34px;
    font-weight: 400;
    line-height: 1.3;
  }
  .source .label {
    flex: none;
    padding: 6px 12px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    background: var(--surface);
    color: var(--muted);
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .rule {
    width: 100%;
    height: 1px;
    margin: 62px 0 30px;
    background: var(--rule);
  }
  .footer {
    display: flex;
    gap: 28px;
    align-items: baseline;
    justify-content: space-between;
    margin: 0;
    color: var(--muted);
    font-size: 27px;
    line-height: 1.4;
  }
  .footer .credit {
    flex: none;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 24px;
    letter-spacing: 0.03em;
  }
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">Live demo</p>
    <h1>Try it live</h1>
    <p class="live">https://rag-docs-chatbot-three.vercel.app</p>
    <p class="source">
      <span class="label">Source</span>
      <span>github.com/willowvibe/rag-docs-chatbot</span>
    </p>
    <div class="rule"></div>
    <p class="footer">
      <span>Free open model &middot; 8 questions per visitor per rolling hour &middot; MIT licensed</span>
      <span class="credit">Built by WillowVibe</span>
    </p>
  </div>
</body>
</html>
