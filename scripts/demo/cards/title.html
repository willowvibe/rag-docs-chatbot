<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rag-docs-chatbot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
  :root {
    --paper: #EEF1F4;
    --surface: #FFFFFF;
    --ink: #1B2333;
    --muted: #5B6676;
    --rule: #D5DBE3;
    --blue: #1F4E8C;
    --blue-soft: #E3EBF6;
    --highlight: #FFE36E;
    --font-ui: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-serif: "Source Serif 4", ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .wrap {
    width: 1920px;
    height: 1080px;
    padding: 120px 150px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .eyebrow {
    margin: 0 0 34px;
    color: var(--blue);
    font-family: var(--font-mono);
    font-size: 26px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0;
    color: var(--ink);
    font-family: var(--font-serif);
    font-size: 120px;
    font-weight: 600;
    line-height: 1.08;
    letter-spacing: -0.025em;
    text-wrap: balance;
  }
  .mark {
    padding: 0 0.06em;
    background-image: linear-gradient(
      transparent 12%, var(--highlight) 12%, var(--highlight) 88%, transparent 88%
    );
    background-repeat: no-repeat;
    background-position: left center;
    background-size: 100% 100%;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
  }
  .lede {
    max-width: 1280px;
    margin: 46px 0 0;
    color: var(--muted);
    font-family: var(--font-serif);
    font-size: 44px;
    font-weight: 400;
    line-height: 1.38;
    letter-spacing: -0.005em;
    text-wrap: balance;
  }
  .footer {
    display: flex;
    gap: 22px;
    align-items: center;
    margin: 86px 0 0;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 22px;
    letter-spacing: 0.04em;
  }
  .footer .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--blue);
  }
  .rule {
    width: 120px;
    height: 3px;
    margin: 0 6px;
    background: var(--rule);
  }
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">rag-docs-chatbot &middot; open source</p>
    <h1>Answers that show their <span class="mark">page</span>.</h1>
    <p class="lede">A chatbot over two NIST identity standards. Every claim cites its page.</p>
    <p class="footer">
      <span class="dot"></span>
      <span>PDF &middot; Markdown &middot; HTML</span>
      <span class="rule"></span>
      <span>cited answers</span>
    </p>
  </div>
</body>
</html>
