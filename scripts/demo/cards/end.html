<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rag-docs-chatbot</title>
<style>
  :root {
    --bg: #0a0f1c;
    --surface: #111a2c;
    --surface-raised: #162239;
    --border: #23324d;
    --border-strong: #31456a;
    --text: #e6edf7;
    --muted: #93a4bf;
    --primary: #0ea5e9;
    --primary-strong: #38bdf8;
    --primary-soft: rgba(14, 165, 233, 0.14);
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body {
    background:
      radial-gradient(900px 500px at 12% -10%, rgba(14, 165, 233, 0.16), transparent 60%),
      radial-gradient(700px 420px at 100% 0%, rgba(56, 189, 248, 0.08), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    width: 1920px;
    height: 1080px;
    padding: 120px 140px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .eyebrow {
    margin: 0 0 24px;
    color: var(--primary-strong);
    font-family: var(--mono);
    font-size: 24px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0;
    font-size: 138px;
    line-height: 1;
    letter-spacing: -0.045em;
    font-weight: 730;
  }
  .live {
    margin: 52px 0 0;
    color: var(--primary-strong);
    font-family: var(--mono);
    font-size: 52px;
    letter-spacing: -0.02em;
  }
  .source {
    margin: 22px 0 0;
    display: flex;
    align-items: baseline;
    gap: 18px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 34px;
  }
  .source .label {
    flex: none;
    padding: 7px 13px;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    color: var(--muted);
    font-size: 19px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .source .url { color: var(--text); }
  .rule {
    width: 100%;
    height: 1px;
    margin: 58px 0 30px;
    background: var(--border);
  }
  .footer {
    margin: 0;
    color: var(--muted);
    font-size: 26px;
  }
  .footer .accent { color: var(--primary-strong); }
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">Live demo</p>
    <h1>Try it live</h1>
    <p class="live">https://rag-docs-chatbot-three.vercel.app</p>
    <p class="source">
      <span class="label">Source</span>
      <span class="url">github.com/willowvibe/rag-docs-chatbot</span>
    </p>
    <div class="rule"></div>
    <p class="footer">8 questions per visitor per hour · MIT licensed</p>
  </div>
</body>
</html>
